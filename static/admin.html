<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>账号控制台</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f4f6f8;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .shell { min-height: 100vh; background: #fff; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid #dfe3e8;
      }
      h1 { margin: 0; font-size: 21px; }
      h2 { margin: 0; font-size: 17px; }
      .content { padding: 0 20px 28px; }
      .section { padding: 22px 0 26px; border-bottom: 1px solid #e5e7eb; }
      .section:last-child { border-bottom: 0; }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .btn {
        display: inline-flex;
        min-height: 32px;
        align-items: center;
        justify-content: center;
        border: 1px solid #c7ced6;
        border-radius: 6px;
        background: #fff;
        color: #1f2937;
        padding: 5px 10px;
        font: inherit;
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover { background: #f3f5f7; }
      .btn-primary { border-color: #2563eb; background: #2563eb; color: #fff; }
      .btn-primary:hover { background: #1d4ed8; }
      .btn-danger { border-color: #fecaca; color: #b91c1c; }
      .table-wrap { width: 100%; overflow-x: auto; border: 1px solid #dfe3e8; border-radius: 6px; }
      table { width: 100%; min-width: 1080px; border-collapse: collapse; table-layout: fixed; }
      th, td {
        padding: 10px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      th { background: #f7f8fa; font-size: 13px; color: #4b5563; }
      tbody tr:last-child td { border-bottom: 0; }
      .account-table th:nth-child(1) { width: 24%; }
      .account-table th:nth-child(2) { width: 16%; }
      .account-table th:nth-child(3) { width: 22%; }
      .account-table th:nth-child(4) { width: 16%; }
      .account-table th:nth-child(5) { width: 22%; }
      .muted { color: #6b7280; font-size: 13px; }
      .good { color: #15803d; font-weight: 700; }
      .bad { color: #b91c1c; font-weight: 700; }
      .warn { color: #b45309; font-weight: 700; }
      .message { min-height: 20px; margin: 0 0 10px; font-size: 13px; }
      .callback-submit {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        margin: 0 0 12px;
      }
      .callback-submit input {
        width: 100%;
        min-width: 0;
        min-height: 34px;
        border: 1px solid #c7ced6;
        border-radius: 6px;
        padding: 6px 9px;
        color: #1f2937;
        font: inherit;
        font-size: 13px;
      }
      .callback-submit input:focus {
        border-color: #2563eb;
        outline: 2px solid #bfdbfe;
        outline-offset: 0;
      }
      .account-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .plan {
        flex: 0 0 auto;
        border-radius: 5px;
        padding: 2px 6px;
        background: #eef2f7;
        font-size: 11px;
        font-weight: 700;
      }
      .quota { display: grid; gap: 5px; }
      .quota-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
      .track { height: 6px; overflow: hidden; border-radius: 5px; background: #dbeafe; }
      .fill { height: 100%; background: #2563eb; }
      dialog {
        width: min(420px, calc(100vw - 24px));
        border: 1px solid #c7ced6;
        border-radius: 8px;
        padding: 20px;
        color: #1f2937;
      }
      dialog::backdrop { background: rgba(17, 24, 39, 0.42); }
      .password-form { display: grid; gap: 14px; }
      .password-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
      .password-form input {
        width: 100%;
        min-height: 38px;
        border: 1px solid #c7ced6;
        border-radius: 6px;
        padding: 7px 9px;
        font: inherit;
      }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
      @media (max-width: 680px) {
        .topbar, .section-head { align-items: flex-start; }
        .topbar, .content { padding-left: 10px; padding-right: 10px; }
        .callback-submit { grid-template-columns: 1fr; }
        th, td { font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <h1>账号控制台</h1>
        <a class="btn" href="/">返回账号主页</a>
      </header>
      <main class="content">
        <section class="section">
          <div class="section-head">
            <h2>ChatGPT账号</h2>
            <div class="actions">
              <a class="btn btn-primary" href="/api/codex/auth/start?reason=admin-import" target="_blank" rel="noopener">添加 Codex 账号</a>
              <a class="btn btn-primary" href="/api/admin/gmail/auth/start" target="_blank" rel="noopener">添加 Gmail</a>
              <a class="btn" href="/api/admin/outlook/auth/start" target="_blank" rel="noopener">添加 Outlook</a>
            </div>
          </div>
          <p class="muted">同一邮箱自动合并为一个账号，密码和 2FA 共享。可单独移除 Codex 或邮箱，也可删除整个账号。</p>
          <div id="mail-message" class="message muted"></div>
          <form id="gmail-callback-form" class="callback-submit">
            <input
              id="gmail-callback-url"
              type="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="Google 授权返回链接"
              aria-label="Google 授权返回链接"
              required
            />
            <button id="gmail-callback-submit" class="btn" type="submit">提交返回链接</button>
          </form>
          <div id="codex-message" class="message muted"></div>
          <form id="codex-callback-form" class="callback-submit">
            <input
              id="codex-callback-url"
              type="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="Codex 授权返回链接"
              aria-label="Codex 授权返回链接"
              required
            />
            <button id="codex-callback-submit" class="btn" type="submit">提交返回链接</button>
          </form>
          <div class="table-wrap">
            <table class="account-table">
              <thead><tr><th>账号</th><th>周额度</th><th>登录信息</th><th>状态</th><th>管理</th></tr></thead>
              <tbody id="account-rows"><tr><td colspan="5" class="muted">加载中...</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="password-dialog">
      <form id="password-form" class="password-form">
        <h2>设置 GPT 密码</h2>
        <div id="password-account" class="muted"></div>
        <div id="password-error" class="bad" role="alert"></div>
        <label>
          GPT 密码
          <input id="password-input" type="password" autocomplete="new-password" maxlength="4096" required />
        </label>
        <div class="dialog-actions">
          <button id="password-cancel" class="btn" type="button">取消</button>
          <button id="password-save" class="btn btn-primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="totp-dialog">
      <form id="totp-form" class="password-form">
        <h2>设置身份验证器(2FA)</h2>
        <div id="totp-account" class="muted"></div>
        <div id="totp-error" class="bad" role="alert"></div>
        <label>
          2FA 密钥（Token）
          <input id="totp-input" type="text" autocomplete="off" spellcheck="false" placeholder="填写2FA密钥，不是六位验证码" maxlength="4096" required />
          <span class="muted">保存后，在主页点击“复制”可获取当前六位验证码。支持大小写和带空格的密钥。</span>
        </label>
        <div class="dialog-actions">
          <button id="totp-cancel" class="btn" type="button">取消</button>
          <button id="totp-save" class="btn btn-primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script>
      const accountRows = document.getElementById('account-rows');
      let accountsLoading = false;
      const mailMessage = document.getElementById('mail-message');
      const codexMessage = document.getElementById('codex-message');
      const gmailCallbackForm = document.getElementById('gmail-callback-form');
      const gmailCallbackUrl = document.getElementById('gmail-callback-url');
      const gmailCallbackSubmit = document.getElementById('gmail-callback-submit');
      const codexCallbackForm = document.getElementById('codex-callback-form');
      const codexCallbackUrl = document.getElementById('codex-callback-url');
      const codexCallbackSubmit = document.getElementById('codex-callback-submit');
      const passwordDialog = document.getElementById('password-dialog');
      const passwordForm = document.getElementById('password-form');
      const passwordAccount = document.getElementById('password-account');
      const passwordInput = document.getElementById('password-input');
      const passwordCancel = document.getElementById('password-cancel');
      const passwordSave = document.getElementById('password-save');
      let passwordAccountName = '';
      const totpDialog = document.getElementById('totp-dialog');
      const totpForm = document.getElementById('totp-form');
      const totpAccount = document.getElementById('totp-account');
      const totpInput = document.getElementById('totp-input');
      const totpCancel = document.getElementById('totp-cancel');
      const totpSave = document.getElementById('totp-save');
      let totpAccountName = '';

      function escapeHtml(value) {
        const node = document.createElement('div');
        node.textContent = value === null || value === undefined ? '' : String(value);
        return node.innerHTML;
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/"/g, '&quot;');
      }

      function formatTime(value) {
        if (!value) return '-';
        const date = new Date(typeof value === 'number' ? value * 1000 : value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
      }

      function setMessage(node, text, error = false) {
        node.textContent = text || '';
        node.className = `message ${error ? 'bad' : 'muted'}`;
      }

      async function api(url, options = {}) {
        const response = await fetch(url, { cache: 'no-store', ...options });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        return data;
      }

      gmailCallbackForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const callbackUrl = gmailCallbackUrl.value.trim();
        if (!callbackUrl) return;
        try {
          gmailCallbackSubmit.disabled = true;
          setMessage(mailMessage, '正在提交 Google 授权返回链接...');
          const data = await api('/api/admin/gmail/auth/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ callback_url: callbackUrl }),
          });
          gmailCallbackUrl.value = '';
          setMessage(mailMessage, data.detail || 'Google 授权完成。');
          await loadAccounts();
        } catch (error) {
          setMessage(mailMessage, error.message, true);
        } finally {
          gmailCallbackSubmit.disabled = false;
        }
      });

      codexCallbackForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const callbackUrl = codexCallbackUrl.value.trim();
        if (!callbackUrl) return;
        try {
          codexCallbackSubmit.disabled = true;
          setMessage(codexMessage, '正在提交 Codex 授权返回链接...');
          const data = await api('/api/codex/auth/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ callback_url: callbackUrl }),
          });
          codexCallbackUrl.value = '';
          setMessage(codexMessage, data.detail || 'Codex 授权完成。');
          await loadAccounts();
        } catch (error) {
          setMessage(codexMessage, error.message, true);
        } finally {
          codexCallbackSubmit.disabled = false;
        }
      });

      function closePasswordDialog() {
        passwordDialog.close();
        passwordInput.value = '';
        passwordAccountName = '';
      }

      passwordCancel.addEventListener('click', closePasswordDialog);

      passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!passwordAccountName || !passwordInput.value) return;
        try {
          passwordSave.disabled = true;
          await api(`/api/admin/accounts/${encodeURIComponent(passwordAccountName)}/gpt-password`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          closePasswordDialog();
          setMessage(mailMessage, 'GPT 密码已保存。');
          await loadAccounts();
        } catch (error) {
          document.getElementById('password-error').textContent = error.message;
        } finally {
          passwordSave.disabled = false;
        }
      });

      function closeTotpDialog() {
        totpDialog.close();
        totpInput.value = '';
        totpAccountName = '';
      }

      totpCancel.addEventListener('click', closeTotpDialog);

      totpForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!totpAccountName || !totpInput.value.trim()) return;
        try {
          totpSave.disabled = true;
          await api(`/api/admin/accounts/${encodeURIComponent(totpAccountName)}/totp-secret`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ secret: totpInput.value }),
          });
          closeTotpDialog();
          setMessage(mailMessage, '身份验证器(2FA)密钥已保存。');
          await loadAccounts();
        } catch (error) {
          document.getElementById('totp-error').textContent = error.message;
        } finally {
          totpSave.disabled = false;
        }
      });

      document.addEventListener('click', async (event) => {
        const totpButton = event.target.closest('[data-totp-action]');
        if (totpButton) {
          const action = totpButton.dataset.totpAction;
          const name = totpButton.dataset.name || '';
          const email = totpButton.dataset.email || '';
          if (action === 'edit') {
            totpAccountName = name;
            totpAccount.textContent = email;
            totpInput.value = '';
            document.getElementById('totp-error').textContent = '';
            totpDialog.showModal();
            totpInput.focus();
          } else if (action === 'delete' && confirm(`确认删除 ${email} 的 2FA 密钥吗？`)) {
            try {
              totpButton.disabled = true;
              await api(`/api/admin/accounts/${encodeURIComponent(name)}/totp-secret`, { method: 'DELETE' });
              setMessage(mailMessage, '身份验证器(2FA)密钥已删除。');
              await loadAccounts();
            } catch (error) {
              setMessage(mailMessage, error.message, true);
              totpButton.disabled = false;
            }
          }
          return;
        }
        const passwordButton = event.target.closest('[data-password-action]');
        if (passwordButton) {
          const action = passwordButton.dataset.passwordAction;
          const name = passwordButton.dataset.name || '';
          const email = passwordButton.dataset.email || '';
          if (action === 'edit') {
            passwordAccountName = name;
            passwordAccount.textContent = email;
            passwordInput.value = '';
            document.getElementById('password-error').textContent = '';
            passwordDialog.showModal();
            passwordInput.focus();
          } else if (action === 'delete' && confirm(`确认删除 ${email} 的 GPT 密码吗？`)) {
            try {
              passwordButton.disabled = true;
              await api(`/api/admin/accounts/${encodeURIComponent(name)}/gpt-password`, { method: 'DELETE' });
              setMessage(mailMessage, 'GPT 密码已删除。');
              await loadAccounts();
            } catch (error) {
              setMessage(mailMessage, error.message, true);
              passwordButton.disabled = false;
            }
          }
          return;
        }
        const button = event.target.closest('[data-mail-action]');
        if (!button) return;
        const action = button.dataset.mailAction;
        const name = button.dataset.name;
        if (action === 'delete' && !confirm('移除邮箱后将停止监听，token 和历史文件会保留。如果还有关联的 Codex，密码和 2FA 会继续保留；移除最后一个关联时删除登录信息。继续吗？')) return;
        try {
          button.disabled = true;
          if (action === 'delete') {
            await api(`/api/admin/mail/accounts/${encodeURIComponent(name)}`, { method: 'DELETE' });
          } else {
            await api(`/api/admin/mail/accounts/${encodeURIComponent(name)}/${action}`, { method: 'POST' });
          }
          setMessage(mailMessage, '操作已完成。');
          await loadAccounts();
        } catch (error) {
          setMessage(mailMessage, error.message, true);
          button.disabled = false;
        }
      });

      function codexPlan(item) {
        const subscription = item.subscription || {};
        if (item.reauth_required && !subscription.plan_type && !subscription.account_plan_type) return '待确认';
        return String(item.chatgpt_plan_type || subscription.account_plan_type || subscription.plan_type || 'free').toUpperCase();
      }

      function subscriptionText(item) {
        const subscription = item.subscription || {};
        if (item.reauth_required) return '重新授权后更新订阅';
        if (item.subscription_error) return '订阅信息暂不可用';
        if (subscription.has_subscription === false || codexPlan(item) === 'FREE') return '无订阅';
        const end = subscription.expires_at || subscription.renews_at;
        return end ? `订阅到期：${formatTime(end)}` : '订阅有效';
      }

      function quotaCell(usage) {
        if (!usage || usage.used_percent === null || usage.used_percent === undefined) return '<span class="muted">未提供</span>';
        const remain = Math.max(0, Math.min(100, Math.round(100 - Number(usage.used_percent))));
        return `<div class="quota"><div class="quota-head"><span>周额度</span><strong>${remain}%</strong></div><div class="track"><div class="fill" style="width:${remain}%"></div></div><div class="muted">${escapeHtml(formatTime(usage.resets_at))} 重置</div></div>`;
      }

      function codexState(item) {
        if (item.reauth_required) return { text: '需重新授权', detail: 'Refresh Token 已失效', cls: 'bad' };
        if (item.error) return { text: item.status || '刷新失败', detail: item.status_reason || item.error, cls: 'bad' };
        if (item.usage_status === 'unavailable') return { text: item.status_reason === 'usage_limit_exhausted' ? '限流' : '不可用', detail: item.status_reason || '额度已耗尽', cls: 'bad' };
        if (item.usage_status === 'available') return { text: '可用', detail: '', cls: 'good' };
        return { text: item.status || '未知', detail: item.status_reason || '', cls: 'warn' };
      }

      function credentialActions(item, type, label, field) {
        if (!item.email || !item.email.includes('@')) return `<div class="muted">${label}：请先完成授权</div>`;
        const present = item[`has_${field}`];
        const name = escapeAttr(item[`${field}_account`]);
        const email = escapeAttr(item.email || item.label || '');
        return `<div class="actions"><span>${label}：${present ? '已添加' : '未配置'}</span><button class="btn" data-${type}-action="edit" data-name="${name}" data-email="${email}">${present ? '修改' : '添加'}</button>${present ? `<button class="btn btn-danger" data-${type}-action="delete" data-name="${name}" data-email="${email}">删除</button>` : ''}</div>`;
      }

      function accountRow(item) {
        const primary = item.codex[0];
        const codexStatuses = item.codex.map(account => {
          const state = codexState(account);
          return `<div class="${state.cls}">${escapeHtml(state.text)} <span class="plan">Codex</span></div>${state.detail ? `<div class="muted">${escapeHtml(state.detail)}</div>` : ''}`;
        }).join('');
        const mailStatuses = item.mail.map(mail => `<div class="${mail.enabled === false ? 'warn' : (/失败|异常|错误|重新授权/.test(mail.status) ? 'bad' : (/监测中|监听中/.test(mail.status) ? 'good' : 'warn'))}">${escapeHtml(mail.enabled === false ? '已停用' : mail.status || '未知')} <span class="plan">邮箱</span></div>`).join('');
        const codexActions = item.codex.map(account => `<div class="actions"><span class="muted">Codex${item.codex.length > 1 ? ' · ' + escapeHtml(account.workspace_id || account.id) : ''}</span>
          <button class="btn" data-codex-action="refresh" data-id="${escapeAttr(account.id)}">刷新额度</button>
          <a class="btn" href="/api/codex/auth/start?reason=admin-reauth&amp;account_id=${encodeURIComponent(account.id)}" target="_blank" rel="noopener">重新授权</a>
          <button class="btn btn-danger" data-codex-action="delete" data-id="${escapeAttr(account.id)}">移除 Codex</button></div>`).join('');
        const mailActions = item.mail.map(mail => `<div class="actions"><span class="muted">${escapeHtml(mail.provider || '邮箱')}</span>
          ${['gmail', 'outlook'].includes(mail.provider) ? `<a class="btn" href="/api/admin/${mail.provider}/auth/start?account_name=${encodeURIComponent(mail.name)}" target="_blank" rel="noopener">重新授权</a>` : ''}
          <button class="btn" data-mail-action="${mail.enabled === false ? 'enable' : 'disable'}" data-name="${escapeAttr(mail.name)}">${mail.enabled === false ? '启用监听' : '停用监听'}</button>
          <button class="btn btn-danger" data-mail-action="delete" data-name="${escapeAttr(mail.name)}">移除邮箱</button></div>`).join('');
        return `<tr><td><div class="account-line"><span class="email">${escapeHtml(item.email || '等待授权')}</span><span class="plan">${primary ? escapeHtml(codexPlan(primary)) : '无Codex'}</span></div><div class="muted">${primary ? escapeHtml(subscriptionText(primary)) : '仅邮箱验证'}</div></td>
          <td>${item.codex.length ? item.codex.map(account => quotaCell(account.usage)).join('<hr>') : '<span class="muted">未提供</span>'}</td>
          <td>${credentialActions(item, 'password', 'GPT密码', 'gpt_password')}${credentialActions(item, 'totp', '身份验证器(2FA)', 'totp_secret')}</td>
          <td>${codexStatuses || '<div class="muted">未关联 <span class="plan">Codex</span></div>'}${mailStatuses || '<div class="muted">无邮箱验证 <span class="plan">邮箱</span></div>'}</td>
          <td>${codexActions}${mailActions}<button class="btn btn-danger" data-delete-account="${escapeAttr(item.key)}" data-email="${escapeAttr(item.email)}">删除整个账号</button></td></tr>`;
      }

      async function loadAccounts(force = true) {
        if (accountsLoading || (!force && accountRows.querySelector('button:disabled'))) return;
        accountsLoading = true;
        try {
          const data = await api('/api/accounts');
          accountRows.innerHTML = data.items.length ? data.items.map(accountRow).join('') : '<tr><td colspan="5" class="muted">暂无账号。请添加 Codex 或接码邮箱，同邮箱会自动合并。</td></tr>';
        } catch (error) {
          setMessage(mailMessage, error.message, true);
        } finally { accountsLoading = false; }
      }

      accountRows.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-delete-account]');
        if (!button || !confirm(`确认删除 ${button.dataset.email} 的全部关联、Codex 授权文件及登录信息？邮箱 token 和验证码历史文件会保留。`)) return;
        try {
          button.disabled = true;
          await api(`/api/admin/accounts/${encodeURIComponent(button.dataset.deleteAccount)}`, { method: 'DELETE' });
          setMessage(mailMessage, '整个账号已删除。');
          await loadAccounts();
        } catch (error) { setMessage(mailMessage, error.message, true); button.disabled = false; }
      });

      accountRows.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-codex-action]');
        if (!button) return;
        const action = button.dataset.codexAction;
        const id = button.dataset.id;
        if (action === 'delete' && !confirm('确认移除这个 Codex 授权及本地 auth 文件吗？其他关联和共享登录信息会保留；移除最后一个关联时删除登录信息。')) return;
        try {
          button.disabled = true;
          const options = { method: action === 'delete' ? 'DELETE' : 'POST' };
          await api(`/api/codex/accounts/${encodeURIComponent(id)}${action === 'refresh' ? '/refresh' : ''}`, options);
          setMessage(codexMessage, action === 'refresh' ? '账号信息已刷新。' : '账号已删除。');
          await loadAccounts();
        } catch (error) {
          setMessage(codexMessage, error.message, true);
          button.disabled = false;
        }
      });

      loadAccounts();
      setInterval(() => loadAccounts(false), 5000);
    </script>
  </body>
</html>
