<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    form { width: min(390px, calc(100vw - 32px)); padding: 28px; background: white; border: 1px solid #dfe3e8; border-radius: 12px; }
    h1 { font-size: 22px; margin: 12px 0; }
    .badge { color: #92400e; background: #fef3c7; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    p { font-size: 13px; color: #6b7280; line-height: 1.6; }
    label { display: block; font-size: 14px; margin: 16px 0; }
    input { width: 100%; padding: 10px; margin-top: 7px; border: 1px solid #c7ced6; border-radius: 6px; font: inherit; }
    input:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
    button { width: 100%; padding: 10px; color: white; background: #2563eb; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    .error { min-height: 20px; color: #b91c1c; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <span class="badge">账号中心</span>
    <h1>登录账号中心</h1>
    <p>使用管理员创建的网站账号登录，查看分配给你的资源。</p>
    <label>用户名<input name="username" autocomplete="username" maxlength="64" required autofocus></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
    <p class="error" role="alert"><!-- LOGIN_ERROR --></p>
    <button type="submit">登录</button>
  </form>
</body>
</html>
