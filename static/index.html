<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ChatGPT账号</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px; background: #f5f7fa; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .container { width: 100%; min-height: calc(100vh - 24px); padding: 16px; background: #fff; border-radius: 8px; box-shadow: 0 8px 20px rgba(0, 0, 0, .08); }
      .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
      h1 { margin: 0; font-size: 22px; }
      .table-wrap { width: 100%; overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
      table { width: 100%; min-width: 980px; border-collapse: collapse; table-layout: fixed; }
      th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
      th { background: #f9fafb; }
      .account-table th:nth-child(1) { width: 28%; }
      .account-table th:nth-child(2) { width: 22%; }
      .account-table th:nth-child(3) { width: 25%; }
      .account-table th:nth-child(4) { width: 25%; }
      tbody tr:last-child td { border-bottom: 0; }
      .muted { color: #6b7280; }
      .status { font-weight: 700; }
      .status-good { color: #15803d; }
      .status-warn { color: #b45309; }
      .status-bad { color: #b91c1c; }
      .status-neutral { color: #6b7280; }
      .small-btn { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #1f2937; cursor: pointer; }
      .small-btn:hover { background: #f8fafc; }
      .small-btn:disabled { cursor: wait; opacity: .65; }
      .account-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .account-email { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
      .plan-pill, .status-tag { display: inline-block; flex: 0 0 auto; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; line-height: 1.4; }
      .plan-pro { background: #fee2e2; color: #991b1b; }
      .plan-plus { background: #dbeafe; color: #1d4ed8; }
      .plan-go { background: #dcfce7; color: #166534; }
      .plan-free, .tag-email { background: #f3f4f6; color: #374151; }
      .plan-other { background: #fef3c7; color: #92400e; }
      .tag-codex { background: #dbeafe; color: #1d4ed8; }
      .quota-cell { display: flex; flex-direction: column; gap: 6px; }
      .quota-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
      .quota-title { color: #6b7280; }
      .quota-value { font-weight: 800; }
      .quota-track { width: 100%; height: 5px; overflow: hidden; border-radius: 999px; background: #bfdbfe; }
      .quota-fill { height: 100%; border-radius: inherit; background: #3b82f6; }
      .quota-empty .quota-track { background: #fecaca; }
      .quota-empty .quota-fill { background: #ef4444; }
      .status-block { display: grid; gap: 6px; }
      .status-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .detail-row td { padding: 0; background: #f8fafc; }
      .detail-panel { display: grid; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #e5e7eb; }
      .login-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .detail-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      .detail-label { min-width: 126px; font-weight: 700; }
      .email-detail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: center; padding-top: 10px; border-top: 1px dashed #d1d5db; }
      .history-inline { grid-column: 1 / -1; margin-top: 2px; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
      .history-item { margin-bottom: 8px; padding-bottom: 7px; border-bottom: 1px dashed #e5e7eb; }
      .history-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
      .history-code { display: inline-block; padding: 2px 6px; border-radius: 6px; background: #fef08a; color: #b45309; font-weight: 700; letter-spacing: 2px; }
      .history-time { color: #166534; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .code { color: #0ea5e9; font-weight: 700; }
      @media (max-width: 680px) { body { padding: 8px; } .container { min-height: calc(100vh - 16px); padding: 10px; } .page-head { align-items: flex-start; } .login-detail, .email-detail { grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-head"><h1>ChatGPT账号</h1><a class="small-btn" href="/admin">账号控制台</a></div>
      <div id="load-error" class="status-bad" role="status"></div>
      <div class="table-wrap">
        <table class="account-table">
          <thead><tr><th>账号</th><th>周额度</th><th>登陆方式</th><th>状态</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="muted">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>
    <script>
      const rowsNode = document.getElementById('rows');
      const HISTORY_REFRESH_MS = 3000;
      let expandedKey = '';
      let historyName = '';
      let historyItems = [];
      let historyLoading = false;
      let historyTimer = null;
      let accountRows = [];
      let refreshing = false;
      let historyError = '';
      let historyRequest = 0;

      function escapeHtml(value) { const node = document.createElement('div'); node.textContent = value === null || value === undefined ? '' : String(value); return node.innerHTML; }
      function escapeAttr(value) { return escapeHtml(value).replace(/"/g, '&quot;'); }
      function formatDateTime(value) { if (!value) return '-'; const date = new Date(value); return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN', { hour12: false }); }
      function formatTsSeconds(value) { return value ? formatDateTime(Number(value) * 1000) : '-'; }
      function resetRemain(value) { if (!value) return '未知'; const minutes = Math.ceil(Math.max(0, Number(value) - Date.now() / 1000) / 60); const days = Math.floor(minutes / 1440); const hours = Math.floor((minutes % 1440) / 60); return days ? `${days}d${hours}h` : (hours ? `${hours}h${minutes % 60}min` : `${minutes}min`); }

      function planValue(item) { const subscription = item.subscription || {}; if (item.reauth_required && !subscription.plan_type && !subscription.account_plan_type) return 'unknown'; return String(item.chatgpt_plan_type || subscription.account_plan_type || subscription.plan_type || '-').toLowerCase(); }
      function planBadge(item, missing = false) {
        const plan = planValue(item);
        if (missing) return '<span class="plan-pill plan-free">无Codex</span>';
        const label = plan === 'unknown' ? '待确认' : (plan === '-' ? 'FREE' : plan.toUpperCase());
        let cls = 'plan-other';
        if (plan.includes('pro')) cls = 'plan-pro'; else if (plan.includes('plus')) cls = 'plan-plus'; else if (plan.includes('go')) cls = 'plan-go'; else if (plan.includes('free') || plan === '-' || plan === 'unknown') cls = 'plan-free';
        return `<span class="plan-pill ${cls}">${escapeHtml(label)}</span>`;
      }
      function accountCell(row) {
        const item = row.codex || row.mail || {};
        const email = item.email || item.label || 'Codex账号';
        const subscription = row.codex && row.codex.subscription || {};
        const plan = planValue(item);
        let detail = '仅邮箱验证';
        if (row.codex && row.codex.reauth_required) detail = '重新授权后更新订阅';
        else if (row.codex && row.codex.subscription_error) detail = '订阅信息暂不可用';
        else if (row.codex && (subscription.has_subscription === false || plan === 'free' || plan === '-')) detail = '无订阅';
        else if (row.codex && subscription.has_subscription === true) { const expiresAt = subscription.expires_at || subscription.renews_at; detail = expiresAt ? `订阅到期：${formatTsSeconds(expiresAt)}` : '订阅有效'; }
        else if (row.codex) detail = '-';
        return `<div class="account-main"><span class="account-email">${escapeHtml(email)}</span>${planBadge(item, !row.codex)}</div><div class="muted">${escapeHtml(detail)}</div>`;
      }
      function quotaCell(usage) {
        if (!usage || usage.used_percent === null || usage.used_percent === undefined) return '<span class="muted">未提供</span>';
        const remain = Math.max(0, Math.min(100, Math.round(100 - Number(usage.used_percent))));
        return `<div class="quota-cell ${remain <= 0 ? 'quota-empty' : ''}"><div class="quota-head"><span class="quota-title">7天</span><span class="quota-value">${remain}%</span></div><div class="quota-track"><div class="quota-fill" style="width:${remain}%"></div></div><div class="muted">${escapeHtml(formatTsSeconds(usage.resets_at))}</div><div class="muted">${escapeHtml(resetRemain(usage.resets_at))}后刷新</div></div>`;
      }
      function statusReasonText(reason) {
        const normalized = String(reason || '').trim().toLowerCase();
        if (!normalized || normalized === 'usage_ok') return '';
        if (normalized.startsWith('refresh_token_invalid')) return 'Refresh Token 失效，需要重新登录';
        const labels = {
          refresh_token_region_blocked: '代理地区不受支持，已暂停账号刷新',
          usage_refresh_timeout: '用量刷新超时，请检查网络或代理',
          usage_refresh_connection: '用量刷新连接失败，请检查网络或代理',
          usage_refresh_dns: '用量刷新 DNS 解析失败，请检查网络或代理',
          usage_refresh_failed: '用量刷新失败，请查看后台日志',
          usage_http_401: '用量接口返回 401，账号授权失效',
          usage_http_403: '用量接口返回 403，账号权限不足或被限制',
          account_deactivated: '账号已停用',
          workspace_deactivated: '工作区已停用',
          deactivated_workspace: '工作区已停用',
          usage_limit_exhausted: '额度已耗尽',
          usage_missing_weekly: '周额度缺失',
          usage_unknown: '用量未知',
        };
        const httpMatch = normalized.match(/^usage_http_(\d{3})$/);
        return httpMatch ? `用量接口返回 HTTP ${httpMatch[1]}` : (labels[normalized] || reason);
      }
      function codexStatus(item) {
        if (!item) return { text: '未关联', cls: 'status-neutral', detail: '' };
        const reason = statusReasonText(item.status_reason);
        if (item.reauth_required) return { text: '需重新授权', cls: 'status-bad', detail: reason || '授权已失效' };
        if (item.error) return { text: item.status || '异常', cls: 'status-bad', detail: reason || item.error };
        if (item.status_reason === 'usage_limit_exhausted') return { text: '限流', cls: 'status-bad', detail: '额度已耗尽' };
        if (item.usage_status === 'available') return { text: '可用', cls: 'status-good', detail: '' };
        if (item.usage_status === 'unavailable') return { text: '不可用', cls: 'status-bad', detail: reason };
        return { text: item.status || '未知', cls: 'status-neutral', detail: reason };
      }
      function statusLine(status, label) { return `<div class="status-line"><span class="status ${status.cls}">${escapeHtml(status.text)}</span><span class="status-tag ${label === 'Codex' ? 'tag-codex' : 'tag-email'}">${label}</span>${status.detail ? `<span class="muted">${escapeHtml(status.detail)}</span>` : ''}</div>`; }
      function historyHtml(mail) {
        if (historyName !== mail.name || historyLoading) return historyLoading && historyName === mail.name ? '<div class="history-inline muted">历史记录加载中...</div>' : '';
        if (historyError) return `<div class="history-inline status-bad">${escapeHtml(historyError)}</div>`;
        if (!historyItems.length) return '<div class="history-inline muted">暂无历史验证码记录。</div>';
        return `<div class="history-inline"><strong>历史验证码</strong>${historyItems.map(item => `<div class="history-item"><div>验证码：<span class="history-code">${escapeHtml(item.code || '')}</span></div><div class="history-time">${escapeHtml(formatDateTime(item.created_at))}</div><div>主题：${escapeHtml(item.subject || '-')}</div></div>`).join('')}</div>`;
      }
      function detailRow(row) {
        const credentials = row.credentials;
        const password = credentials && credentials.has_gpt_password ? `<button class="small-btn" data-copy-type="password" data-name="${escapeAttr(credentials.gpt_password_account)}">复制</button>` : '<span class="muted">未设置</span>';
        const totp = credentials && credentials.has_totp_secret ? `<button class="small-btn" data-copy-type="totp" data-name="${escapeAttr(credentials.totp_secret_account)}">复制</button>` : '<span class="muted">未配置</span>';
        const emailLine = row.mails.length ? row.mails.map(mail => `<div class="email-detail"><div><strong>最新验证码：</strong><span class="code">${escapeHtml(mail.last_code || '暂无')}</span></div><div><strong>主题：</strong>${escapeHtml(mail.subject || '-')}</div><div><strong>更新时间：</strong>${escapeHtml(formatDateTime(mail.updated_at))}</div><div><strong>历史记录：</strong><button class="small-btn" aria-expanded="${historyName === mail.name}" data-history-name="${escapeAttr(mail.name)}">${historyName === mail.name ? '收起' : '查看历史'}</button></div>${historyHtml(mail)}</div>`).join('') : '';
        return `<tr class="detail-row"><td colspan="4"><div class="detail-panel"><div class="login-detail"><div class="detail-line"><span class="detail-label">GPT密码</span>${password}</div><div class="detail-line"><span class="detail-label">身份验证器(2FA)</span>${totp}</div></div>${emailLine}</div></td></tr>`;
      }
      function rowHtml(row) {
        const codex = codexStatus(row.codex);
        const emailStatuses = row.mails.length ? row.mails.map(mail => ({ text: mail.enabled === false ? '已停用' : (mail.status || '未知'), cls: mail.enabled === false ? 'status-warn' : (/失败|异常|错误|重新授权/.test(mail.status || '') ? 'status-bad' : (/监测中|监听中/.test(mail.status || '') ? 'status-good' : 'status-warn')), detail: row.mails.length > 1 ? mail.provider : '' })) : [{ text: '无邮箱验证', cls: 'status-neutral', detail: '' }];
        const expanded = expandedKey === row.key;
        return `<tr><td>${accountCell(row)}</td><td>${row.codexItems.length ? row.codexItems.map(item => quotaCell(item.usage)).join('<hr>') : quotaCell(null)}</td><td><button class="small-btn" aria-expanded="${expanded}" data-expand-key="${escapeAttr(row.key)}">${expanded ? '收起' : '展开'}</button></td><td><div class="status-block">${row.codexItems.length ? row.codexItems.map(item => statusLine(codexStatus(item), 'Codex')).join('') : statusLine(codex, 'Codex')}${emailStatuses.map(status => statusLine(status, '邮箱')).join('')}</div></td></tr>${expanded ? detailRow(row) : ''}`;
      }
      async function loadHistory(name) {
        if (rowsNode.querySelector('[data-copy-type]:disabled')) return;
        const request = ++historyRequest;
        historyName = name; historyLoading = !historyItems.length; historyError = ''; render();
        try {
          const response = await fetch(`/api/history/${encodeURIComponent(name)}`, { cache: 'no-store' });
          if (!response.ok) throw new Error('历史记录加载失败，请稍后重试。');
          const data = await response.json();
          if (historyName === name && request === historyRequest) historyItems = data.items || [];
        } catch (error) {
          if (historyName === name && request === historyRequest) historyError = error.message;
        }
        if (historyName === name && request === historyRequest) { historyLoading = false; if (!rowsNode.querySelector('[data-copy-type]:disabled')) render(); }
      }
      function toggleHistory(name) {
        if (historyName === name) { historyName = ''; historyItems = []; historyError = ''; historyRequest++; if (historyTimer) clearInterval(historyTimer); historyTimer = null; render(); return; }
        if (historyTimer) clearInterval(historyTimer);
        historyItems = [];
        loadHistory(name);
        historyTimer = setInterval(() => { if (historyName === name && !historyLoading) loadHistory(name); }, HISTORY_REFRESH_MS);
      }
      async function writeClipboard(value) {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(value); return; }
        const input = document.createElement('textarea');
        input.value = value; input.style.position = 'fixed'; input.style.opacity = '0';
        document.body.appendChild(input); input.focus(); input.select();
        const copied = document.execCommand('copy'); input.remove();
        if (!copied) throw new Error('浏览器拒绝访问剪贴板');
      }
      async function copySecret(button) {
        button.disabled = true; const original = button.textContent;
        try { const path = button.dataset.copyType === 'totp' ? 'totp-secret' : 'gpt-password'; const field = button.dataset.copyType === 'totp' ? 'secret' : 'password'; const response = await fetch(`/api/accounts/${encodeURIComponent(button.dataset.name)}/${path}`, { method: 'POST', cache: 'no-store' }); const data = await response.json(); if (!response.ok || !data[field]) throw new Error(data.detail || '读取失败'); await writeClipboard(data[field]); button.textContent = '已复制'; } catch (error) { button.textContent = '复制失败'; }
        setTimeout(() => { button.textContent = original; button.disabled = false; }, 1500);
      }
      function render() {
        rowsNode.innerHTML = accountRows.length ? accountRows.map(rowHtml).join('') : '<tr><td colspan="4" class="muted">暂无账号。</td></tr>';
      }
      async function refreshAccounts() {
        if (refreshing || rowsNode.querySelector('[data-copy-type]:disabled')) return;
        refreshing = true;
        try {
          const response = await fetch('/api/accounts', { cache: 'no-store' });
          if (!response.ok) throw new Error('加载失败');
          const data = await response.json();
          accountRows = (data.items || []).map(item => ({ key: item.key, credentials: item, codex: item.codex[0] || null, codexItems: item.codex, mail: item.mail[0] || null, mails: item.mail }));
          if (expandedKey && !accountRows.some(row => row.key === expandedKey)) {
            expandedKey = ''; historyName = ''; historyItems = []; historyRequest++;
            clearInterval(historyTimer); historyTimer = null;
          }
          document.getElementById('load-error').textContent = '';
          if (!rowsNode.querySelector('[data-copy-type]:disabled')) render();
        } catch (error) {
          document.getElementById('load-error').textContent = '账号刷新失败，请检查服务或重新登录。';
        } finally { refreshing = false; }
      }
      rowsNode.addEventListener('click', event => { const expand = event.target.closest('[data-expand-key]'); if (expand) { const nextKey = expandedKey === expand.dataset.expandKey ? '' : expand.dataset.expandKey; if (historyTimer) clearInterval(historyTimer); historyTimer = null; historyName = ''; historyItems = []; historyError = ''; historyRequest++; expandedKey = nextKey; render(); return; } const history = event.target.closest('[data-history-name]'); if (history) { toggleHistory(history.dataset.historyName); return; } const copy = event.target.closest('[data-copy-type]'); if (copy) copySecret(copy); });
      refreshAccounts();
      setInterval(refreshAccounts, 3000);
    </script>
  </body>
</html>
