<!doctype html>
<html lang="zh-CN" data-theme="system" data-theme-account="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>用户登录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--theme-page-bg, #f4f6f8); color: var(--theme-text, #1f2937); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    form { width: min(390px, calc(100vw - 32px)); padding: 28px; background: var(--theme-surface, white); border: 1px solid var(--theme-border, #dfe3e8); border-radius: 12px; }
    h1 { font-size: 22px; margin: 12px 0; }
    .badge { color: var(--theme-warning-text, #92400e); background: var(--theme-warning-bg, #fef3c7); padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    p { font-size: 13px; color: var(--theme-muted, #6b7280); line-height: 1.6; }
    label { display: block; font-size: 14px; margin: 16px 0; }
    label[hidden] { display: none; }
    [hidden] { display: none !important; }
    input { width: 100%; padding: 10px; margin-top: 7px; border: 1px solid var(--theme-border-strong, #c7ced6); border-radius: 6px; font: inherit; }
    input:focus { outline: 2px solid var(--theme-info-border, #bfdbfe); border-color: var(--theme-focus, #2563eb); }
    button { width: 100%; padding: 10px; color: white; background: #2563eb; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    .mode-link { display: block; margin-top: 12px; padding: 9px; text-align: center; color: var(--theme-link, #1d4ed8); border: 1px solid var(--theme-border-strong, #c7ced6); border-radius: 6px; text-decoration: none; }
    .error { min-height: 20px; color: var(--theme-danger-text, #b91c1c); }
    #login-challenge { margin-top: 20px; padding-top: 4px; border-top: 1px solid var(--theme-border, #dfe3e8); }
    #login-challenge-widget { min-height: 65px; }
    #login-challenge-status { min-height: 20px; }
    #login-challenge-retry { color: var(--theme-link, #1d4ed8); background: var(--theme-page-bg, #f4f6f8); }
    .challenge-demo { color: var(--theme-warning-text, #92400e); }
    button:disabled { opacity: .65; cursor: wait; }
  </style>
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/theme.js" defer></script>
  <!-- LOGIN_PROTECTION -->
</head>
<body class="login-page">
  <header class="login-theme-header"><div data-theme-control></div></header>
  <main class="login-main">
  <form id="login-form" method="post" action="/login">
    <span class="badge">账户中心</span>
    <h1 id="login-title">用户登录</h1>
    <p id="login-description">使用管理员创建的网站账户登录，查看分配给你的资源。</p>
    <label>用户名<input name="username" autocomplete="username" maxlength="64" required autofocus></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <label id="totp-field" hidden>动态验证码<input name="totp_code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" disabled></label>
    <!-- LOGIN_CHALLENGE -->
    <p class="error" role="alert"><!-- LOGIN_ERROR --></p>
    <button type="submit">登录</button>
    <a class="mode-link" id="login-mode" href="/login?mode=admin">管理员登录</a>
  </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('mode') === 'admin') {
      document.title = '管理员登录';
      document.getElementById('login-title').textContent = document.title;
      document.getElementById('login-description').textContent = '登录后可进入账号控制台。';
      document.getElementById('login-form').action = '/login?mode=admin';

      const codeField = document.getElementById('totp-field');
      codeField.hidden = false;
      codeField.querySelector('input').disabled = false;

      const modeLink = document.getElementById('login-mode');
      modeLink.href = '/login';
      modeLink.textContent = '返回用户登录';
    }
  </script>
</body>
</html>
